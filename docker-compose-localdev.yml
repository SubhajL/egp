x-egp-logging: &egp-logging
  driver: json-file
  options:
    max-size: "${EGP_LOG_MAX_SIZE:-10m}"
    max-file: "${EGP_LOG_MAX_FILES:-3}"

services:
  postgres:
    image: postgres:15-alpine
    container_name: egp-postgres
    restart: unless-stopped
    mem_limit: ${EGP_POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${EGP_POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${EGP_POSTGRES_PIDS_LIMIT:-256}
    logging: *egp-logging
    environment:
      POSTGRES_DB: ${EGP_POSTGRES_DB:-egp}
      POSTGRES_USER: ${EGP_POSTGRES_USER:-egp}
      POSTGRES_PASSWORD: ${EGP_POSTGRES_PASSWORD:-egp_dev}
    ports:
      - "${EGP_POSTGRES_PORT:-5434}:5432"
    volumes:
      - egp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EGP_POSTGRES_USER:-egp} -d ${EGP_POSTGRES_DB:-egp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: egp-migrate
    restart: "no"
    mem_limit: ${EGP_MIGRATE_MEMORY_LIMIT:-256m}
    cpus: ${EGP_MIGRATE_CPU_LIMIT:-0.5}
    pids_limit: ${EGP_MIGRATE_PIDS_LIMIT:-128}
    logging: *egp-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      DATABASE_URL: postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - egp_db.migration_runner
      - --database-url
      - postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
      - --migrations-dir
      - /app/packages/db/src/migrations

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: egp-api
    restart: unless-stopped
    mem_limit: ${EGP_API_MEMORY_LIMIT:-768m}
    cpus: ${EGP_API_CPU_LIMIT:-1.0}
    pids_limit: ${EGP_API_PIDS_LIMIT:-256}
    logging: *egp-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      DATABASE_URL: postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
      EGP_ARTIFACT_ROOT: /var/lib/egp/artifacts
      EGP_ARTIFACT_STORE: local
      EGP_PAYMENT_PROVIDER: ${EGP_PAYMENT_PROVIDER:-mock_promptpay}
      # mock_promptpay builds the PromptPay QR locally from this proxy id (no
      # external acquirer / no network). Without it the provider resolves to
      # None and billing raises "payment provider is not configured" at the
      # Create-PromptPay-QR step. Dev placeholder — override via .env.localdev.
      EGP_PROMPTPAY_PROXY_ID: ${EGP_PROMPTPAY_PROXY_ID:-0899999999}
      EGP_PAYMENT_CALLBACK_SECRET: ${EGP_PAYMENT_CALLBACK_SECRET:-top-secret}
      EGP_OPN_SECRET_KEY: ${EGP_OPN_SECRET_KEY:-}
      EGP_OPN_PUBLIC_KEY: ${EGP_OPN_PUBLIC_KEY:-}
      EGP_OPN_WEBHOOK_SECRET: ${EGP_OPN_WEBHOOK_SECRET:-}
      EGP_AUTH_REQUIRED: ${EGP_AUTH_REQUIRED:-false}
      EGP_JWT_SECRET: ${EGP_JWT_SECRET:-dev-jwt-secret}
      EGP_JWT_ISSUER: ${EGP_JWT_ISSUER:-http://localhost/egp-machine-issuer}
      EGP_JWT_AUDIENCE: ${EGP_JWT_AUDIENCE:-egp-api-local}
      EGP_JWT_CLOCK_SKEW_SECONDS: ${EGP_JWT_CLOCK_SKEW_SECONDS:-30}
      EGP_SESSION_COOKIE_SECURE: ${EGP_SESSION_COOKIE_SECURE:-false}
      EGP_WEB_ALLOWED_ORIGINS: http://127.0.0.1:${EGP_WEB_PORT:-3002},http://localhost:${EGP_WEB_PORT:-3002}
      EGP_WEB_BASE_URL: http://127.0.0.1:${EGP_WEB_PORT:-3002}
      EGP_INTERNAL_WORKER_TOKEN: ${EGP_INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}
      EGP_BACKGROUND_RUNTIME_MODE: ${EGP_BACKGROUND_RUNTIME_MODE:-external}
      EGP_CRAWLER_HEARTBEAT_STALE_AFTER_SECONDS: ${EGP_CRAWLER_HEARTBEAT_STALE_AFTER_SECONDS:-90}
      # U8b: how long before the inbox processor's heartbeat reads as wedged.
      EGP_CRAWLER_AGENT_INBOX_STALE_AFTER_SECONDS: ${EGP_CRAWLER_AGENT_INBOX_STALE_AFTER_SECONDS:-120}
      # The API SERVES the agent endpoints and derives delivery_mode from
      # this, so it needs the flag as much as the executor does. Compose
      # does not pass the env file wholesale: without this line the API
      # always reads 'off', the V1 endpoints 404 forever, and shadow can
      # never be enabled no matter what /etc/egp/egp.env says.
      EGP_CRAWLER_AGENT_PROTOCOL: ${EGP_CRAWLER_AGENT_PROTOCOL:-off}
      EGP_DISCOVERY_LEASE_SECONDS: ${EGP_DISCOVERY_LEASE_SECONDS:-60}
      EGP_DISCOVERY_LEASE_HEARTBEAT_SECONDS: ${EGP_DISCOVERY_LEASE_HEARTBEAT_SECONDS:-20}
      EGP_BROWSER_CDP_PORT_BASE: ${EGP_BROWSER_CDP_PORT_BASE:-9222}
      EGP_BROWSER_CDP_PORT_RANGE: ${EGP_BROWSER_CDP_PORT_RANGE:-200}
      EGP_BROWSER_PROFILE_ROOT: ${EGP_BROWSER_PROFILE_ROOT:-~/.egp/profiles}
    ports:
      - "${EGP_API_PORT:-8010}:8000"
    volumes:
      - egp_artifacts:/var/lib/egp/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  webhook-executor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: egp-webhook-executor
    restart: unless-stopped
    mem_limit: ${EGP_WEBHOOK_EXECUTOR_MEMORY_LIMIT:-256m}
    cpus: ${EGP_WEBHOOK_EXECUTOR_CPU_LIMIT:-0.5}
    pids_limit: ${EGP_WEBHOOK_EXECUTOR_PIDS_LIMIT:-128}
    logging: *egp-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      DATABASE_URL: postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - egp_api.executors.webhook_delivery
    healthcheck:
      disable: true

  crawler-agent-inbox-executor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: ${EGP_CRAWLER_AGENT_INBOX_MEMORY_LIMIT:-256m}
    cpus: ${EGP_CRAWLER_AGENT_INBOX_CPU_LIMIT:-0.5}
    pids_limit: ${EGP_CRAWLER_AGENT_INBOX_PIDS_LIMIT:-128}
    logging: *egp-logging
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      # Compose does not pass the env file wholesale; every variable this process
      # reads must be enumerated here or it will not exist in the container.
      DATABASE_URL: postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
      EGP_CRAWLER_AGENT_PROTOCOL: ${EGP_CRAWLER_AGENT_PROTOCOL:-off}
      EGP_CRAWLER_AGENT_INBOX_LEASE_SECONDS: ${EGP_CRAWLER_AGENT_INBOX_LEASE_SECONDS:-300}
      EGP_CRAWLER_AGENT_INBOX_BACKOFF_SECONDS: ${EGP_CRAWLER_AGENT_INBOX_BACKOFF_SECONDS:-60}
      # U8b: liveness identity. The executor WRITES the heartbeat; the API
      # reads the staleness threshold, so they are enumerated separately.
      EGP_CRAWLER_AGENT_INBOX_PROCESSOR_ID: ${EGP_CRAWLER_AGENT_INBOX_PROCESSOR_ID:-crawler-agent-inbox}
      # U8a: this process now dispatches NEW_PROJECT notifications through the
      # same entitlement-gated stack as the API. Without these the in-app row and
      # webhook delivery still happen but email is SILENTLY skipped — which is the
      # exact class of drift U8a exists to remove.
      EGP_SMTP_HOST: ${EGP_SMTP_HOST:-}
      EGP_SMTP_PORT: ${EGP_SMTP_PORT:-587}
      EGP_SMTP_USERNAME: ${EGP_SMTP_USERNAME:-}
      EGP_SMTP_PASSWORD: ${EGP_SMTP_PASSWORD:-}
      EGP_SMTP_FROM: ${EGP_SMTP_FROM:-}
      EGP_SMTP_USE_TLS: ${EGP_SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - egp_api.executors.crawler_agent_results
    # Background worker (no HTTP server) — same reasoning as webhook-executor:
    # the apps/api/Dockerfile HEALTHCHECK curls :8000/ready, which never succeeds
    # here. A running PID is not proof the processor can drain; that signal
    # belongs with the U8 observability work.
    healthcheck:
      disable: true

  discovery-executor:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: egp-discovery-executor
    restart: unless-stopped
    mem_limit: ${EGP_DISCOVERY_EXECUTOR_MEMORY_LIMIT:-2g}
    cpus: ${EGP_DISCOVERY_EXECUTOR_CPU_LIMIT:-2.0}
    pids_limit: ${EGP_DISCOVERY_EXECUTOR_PIDS_LIMIT:-512}
    logging: *egp-logging
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
      - /var/lib/egp/browser-profiles:rw,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    environment:
      DATABASE_URL: postgresql://${EGP_POSTGRES_USER:-egp}:${EGP_POSTGRES_PASSWORD:-egp_dev}@postgres:5432/${EGP_POSTGRES_DB:-egp}
      EGP_ARTIFACT_ROOT: /var/lib/egp/artifacts
      EGP_ARTIFACT_STORE: local
      EGP_DISCOVERY_WORKER_COUNT: ${EGP_DISCOVERY_WORKER_COUNT:-1}
      EGP_DISCOVERY_LEASE_SECONDS: ${EGP_DISCOVERY_LEASE_SECONDS:-60}
      EGP_DISCOVERY_LEASE_HEARTBEAT_SECONDS: ${EGP_DISCOVERY_LEASE_HEARTBEAT_SECONDS:-20}
      EGP_DISCOVERY_FAULT_INJECTION_ENABLED: ${EGP_DISCOVERY_FAULT_INJECTION_ENABLED:-false}
      EGP_CRAWLER_AGENT_PROTOCOL: ${EGP_CRAWLER_AGENT_PROTOCOL:-off}
      EGP_INTERNAL_API_BASE_URL: http://api:8000
      EGP_INTERNAL_WORKER_TOKEN: ${EGP_INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}
      EGP_CRAWLER_AGENT_ID: inbox-discovery-executor
      EGP_CRAWLER_HEARTBEAT_INTERVAL_SECONDS: ${EGP_CRAWLER_HEARTBEAT_INTERVAL_SECONDS:-30}
      EGP_BROWSER_CDP_PORT_BASE: ${EGP_BROWSER_CDP_PORT_BASE:-9222}
      EGP_BROWSER_CDP_PORT_RANGE: ${EGP_BROWSER_CDP_PORT_RANGE:-200}
      EGP_BROWSER_PROFILE_ROOT: /var/lib/egp/browser-profiles
      EGP_RELEASE_SHA: ${EGP_RELEASE_SHA:-}
    volumes:
      - egp_artifacts:/var/lib/egp/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - egp_api.executors.discovery_dispatch

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_EGP_API_BASE_URL: http://127.0.0.1:${EGP_API_PORT:-8010}
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${EGP_WEB_PORT:-3002}
    container_name: egp-web
    restart: unless-stopped
    mem_limit: ${EGP_WEB_MEMORY_LIMIT:-512m}
    cpus: ${EGP_WEB_CPU_LIMIT:-1.0}
    pids_limit: ${EGP_WEB_PIDS_LIMIT:-256}
    logging: *egp-logging
    environment:
      NEXT_PUBLIC_EGP_API_BASE_URL: http://127.0.0.1:${EGP_API_PORT:-8010}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${EGP_WEB_PORT:-3002}
    ports:
      - "${EGP_WEB_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  egp_pgdata:
  egp_artifacts:
