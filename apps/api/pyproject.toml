[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egp-api"
version = "0.1.0"
description = "e-GP Intelligence Platform API Service"
requires-python = ">=3.12"
dependencies = [
    "egp-monorepo",
    # Cap below 0.137: FastAPI 0.137 rejects empty-path routes
    # (FastAPIError "Prefix and path cannot be both empty"), which the API uses
    # pervasively (e.g. @router.get("") + include prefix). Pinned to the tested
    # 0.135.x range; broadening requires the empty-path-route refactor first.
    "fastapi>=0.115,<0.136",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "PyJWT[crypto]>=2.13",
    "cryptography>=43",
    "boto3>=1.35",
    "supabase>=2.28",
    "openpyxl>=3.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff==0.15.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["egp_api", "egp_api.*"]

[tool.uv.sources]
egp-monorepo = { workspace = true }
