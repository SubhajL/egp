name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.32'
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://egp:egp_dev@localhost:5432/egp_test'

jobs:
  lint-python:
    name: Python Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync frozen Python workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Run ruff check
        run: uv run --frozen ruff check apps/ packages/ tests/ scripts/

      - name: Run ruff format check
        run: uv run --frozen ruff format --check apps/ packages/ tests/ scripts/

  lint-frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync frozen Python workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check generated API types
        working-directory: apps/web
        run: npm run check:api-types

      - name: Run TypeScript type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: apps/web
        run: npm run test:unit

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

  db-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: egp
          POSTGRES_PASSWORD: egp_dev
          POSTGRES_DB: egp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egp -d egp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync frozen Python workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Verify migration manifest
        run: uv run --frozen python scripts/check_migration_manifest.py --check

      - name: Apply exact migration set
        run: >-
          uv run --frozen python -m egp_db.migration_runner
          --database-url "$DATABASE_URL"
          --migrations-dir packages/db/src/migrations

      - name: Run PostgreSQL API contracts
        env:
          EGP_CI_POSTGRES_CONTRACT: '1'
        run: >-
          uv run --frozen python -m pytest -q
          tests/phase1/test_migration_runner.py::test_ci_postgres_records_exact_migration_set
          tests/phase1/test_api_readiness.py::test_ci_postgres_readiness_accepts_exact_migration_set

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: egp
          POSTGRES_PASSWORD: egp_dev
          POSTGRES_DB: egp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egp -d egp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync frozen Python workspace
        run: uv sync --frozen --all-packages --all-extras

      - name: Apply exact migration set
        run: >-
          uv run --frozen python -m egp_db.migration_runner
          --database-url "$DATABASE_URL"
          --migrations-dir packages/db/src/migrations

      - name: Run Python tests
        run: uv run --frozen python -m pytest tests/ apps/ packages/ -v --tb=short

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace \
            --output-file /tmp/egp-runtime-requirements.txt >/dev/null
          uv run --frozen pip-audit --strict --disable-pip \
            --requirement /tmp/egp-runtime-requirements.txt

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  critical-playwright:
    name: Critical Playwright Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run critical Playwright smoke
        working-directory: apps/web
        run: npm run test:e2e:critical

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate API Docker image
        run: docker build -f apps/api/Dockerfile .

      - name: Validate Worker Docker image
        run: docker build -f apps/worker/Dockerfile .

      - name: Validate Frontend Docker image
        run: docker build -f apps/web/Dockerfile apps/web
